# Checks every pull request, and main after each merge.
#
# Flutter is pinned to the version the project is built with -- the revision
# recorded in .metadata. Bump FLUTTER_VERSION and .metadata together when
# upgrading the SDK.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes its older run pointless. Runs on main
# are left to finish, so every merge shows whether it broke anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Fails, rather than quietly re-resolving, if pubspec.lock is out of date.
      - run: flutter pub get --enforce-lockfile
      # Infos and warnings are fatal by default, and the tree is clean.
      - run: flutter analyze
      - run: flutter test

  android:
    # Several tests read the Android files as text, but only a real Gradle
    # build catches a broken manifest merge or plugin registration.
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --debug
      # The release path, signed with a throwaway key made on the spot: proves
      # android/key.properties is read and the bundle is not debug-signed.
      # The real upload key never comes near CI (docs/releasing.md).
      - name: Signed release bundle
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.jks" \
            -alias upload -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-only -keypass ci-only -dname "CN=CI throwaway"
          printf 'storeFile=%s\nstorePassword=ci-only\nkeyAlias=upload\nkeyPassword=ci-only\n' \
            "$RUNNER_TEMP/ci.jks" > android/key.properties
          flutter build appbundle
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/cert.txt"
          grep -q "CN=CI throwaway" "$RUNNER_TEMP/cert.txt"
      # The same release build as an APK, for installing straight onto a phone
      # (Play takes the bundle; a phone takes an APK). Signed with the
      # throwaway key above, which changes every run: uninstall the previous
      # copy before installing a new one.
      - name: Installable release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: death-by-slides-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  windows:
    # Windows is the everyday target through run-windows.bat, and the gamepads
    # plugin brings native code of its own to compile. windows-latest ships
    # Visual Studio 2026, which audioplayers_windows (under flame_audio) needs
    # 4.4.1 or newer for.
    name: Windows debug build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --debug
